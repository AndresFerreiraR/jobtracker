name: backend

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/backend.yml"

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  SOLUTION: api/JobTracker.sln

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobtracker_ci
          POSTGRES_USER: jobtracker
          POSTGRES_PASSWORD: jobtracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobtracker -d jobtracker_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('api/**/*.csproj', 'api/**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore /warnaserror

      - name: Unit tests
        run: >
          dotnet test api/tests/JobTracker.Tests.Unit/JobTracker.Tests.Unit.csproj
          --configuration Release --no-build --logger "trx;LogFileName=unit.trx"
          --collect:"XPlat Code Coverage"

      - name: Architecture tests
        run: >
          dotnet test api/tests/JobTracker.Tests.Architecture/JobTracker.Tests.Architecture.csproj
          --configuration Release --no-build --logger "trx;LogFileName=architecture.trx"

      - name: Integration tests
        env:
          ConnectionStrings__JobTracker: Host=localhost;Port=5432;Database=jobtracker_ci;Username=jobtracker;Password=jobtracker
        run: >
          dotnet test api/tests/JobTracker.Tests.Integration/JobTracker.Tests.Integration.csproj
          --configuration Release --no-build --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: "**/TestResults/**/*"

  docker-image:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api image
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jobtracker-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/jobtracker-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
