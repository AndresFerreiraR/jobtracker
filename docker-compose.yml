name: jobtracker

# JobTracker full stack (Postgres + .NET API + Next.js web).
# The API applies EF Core migrations at startup when Database:AutoMigrate is true.
# Host ports:
#   - Web:      http://localhost:59082
#   - API:      http://localhost:59081
#   - Postgres: localhost:5432   (make sure no other Postgres is bound to 5432)
services:
  postgres:
    image: postgres:16-alpine
    container_name: jobtracker-postgres
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [jobtracker-net]

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: jobtracker/api:local
    container_name: jobtracker-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__JobTracker: "Host=postgres;Port=5432;Database=jobtracker;Username=jobtracker;Password=jobtracker"
      Database__AutoMigrate: "true"
      Jwt__Enabled: "false"
      FileStorage__RootPath: "/app/uploads"
      FileStorage__PublicBaseUrl: "/uploads"
    ports:
      - "59081:8080"
    volumes:
      - api-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [jobtracker-net]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:59081"
    image: jobtracker/web:local
    container_name: jobtracker-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_BASE_URL: "http://api:8080"
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:59081"
      DEFAULT_ORG_ID: "11111111-1111-1111-1111-111111111111"
    ports:
      - "59082:3000"
    networks: [jobtracker-net]

volumes:
  postgres-data:
  api-uploads:

networks:
  jobtracker-net:
    driver: bridge
